services:
  drive_ros:
    container_name: drive_ros
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: prod
      args:
        - ROS_DISTRO=humble
        - RMW_IMPLEMENTATION=rmw_zenoh_cpp
        - USERNAME=drive
    environment:
      - ROS_DOMAIN_ID=4
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    volumes:
      - ./drive_datasets/:/home/ws/drive_datasets/
      - ./ros/:/home/ws/ros/
      - ./src/:/home/ws/src/
