name: Python application

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check proper formatting
        run: |
          black --check --config pyproject.toml --include '\.py$' .
      - name: Create .env from template
        run: |
          # Use the commented example values from .env.template (humble + default middleware)
          grep -E '^#[A-Z_]+=' .env.template | sed 's/^#//' > .env
          cat .env
      - name: Build docker container
        run: |
          docker compose build
      # - name: Test with pytest
      #   run: |
      #     python -m pytest
