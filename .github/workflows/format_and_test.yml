name: Python application

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check proper formatting
        run: |
          black --check --config pyproject.toml --include '\.py$' .
      - name: Create .env from template
        run: |
          # Use the commented example values from .env.template (humble + default middleware)
          grep -E '^#[A-Z_]+=' .env.template | sed 's/^#//' > .env
          cat .env
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["8.8.8.8", "1.1.1.1"]
      - name: Build docker container
        # Builds the services of docker-compose.yml, reusing layers cached by previous runs
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
